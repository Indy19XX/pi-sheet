<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Sheet Call Assistant</title>
<meta name="description" content="Seller call script and Property Information Sheet for BOFSLO investors.">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PI Sheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="appstyle">
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#5f6673;--line:#e3e6eb;--accent:#1f6f5c;--accent-soft:#e6f2ee;--ai:#fff7e0;--ai-line:#f0c75e;--warn:#b4441c;--warn-soft:#fbece6;--blue:#2556a8;--blue-soft:#e9effa}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--ink:#eceef1;--muted:#9aa1ad;--line:#2c3038;--accent:#4fb79b;--accent-soft:#1d2e29;--ai:#2f2a1a;--ai-line:#8a7130;--warn:#f08a62;--warn-soft:#33221c;--blue:#7fa6ea;--blue-soft:#1d2533}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
header .meta{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
header label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
header input{width:150px}
.wrap{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px;padding:18px 22px;max-width:1400px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static!important;max-height:none!important}}
.side{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 88px);overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.rec{background:var(--warn);border-color:var(--warn);color:#fff}
button:disabled{opacity:.5;cursor:default}
.mic{width:100%;padding:11px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.rec .dot{animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:17px}
.status.err{color:var(--warn)}
textarea,input[type=text],input[type=date],input[type=tel],input[type=email]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
#transcript{min-height:190px;resize:vertical;font-size:13px}
.interim{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;min-height:16px}
.next{background:var(--blue-soft);border-color:transparent}
.next h2{color:var(--blue)}
.next .say{font-size:15px;font-weight:500}
.next .done{color:var(--accent);font-weight:600}
.sheet{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.q{display:flex;flex-direction:column;gap:5px;border-radius:9px;padding:6px;margin:-6px;transition:background .2s}
.q.wide{grid-column:1/-1}
.q.current{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
.q label.l{font-size:12px;font-weight:600;color:var(--muted)}
.q .s{font-size:13.5px;color:var(--ink)}
.q .s::before{content:"Say: ";font-weight:600;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.q.ai input,.q.ai textarea,.q.ai .seg{background:var(--ai);border-color:var(--ai-line)}
.tag{display:none;font-size:10.5px;font-weight:600;color:#8a6510;background:var(--ai);border:1px solid var(--ai-line);border-radius:5px;padding:0 5px;margin-left:6px;cursor:help}
@media (prefers-color-scheme:dark){.tag{color:#f0c75e}}
.q.ai .tag{display:inline-block}
.money{position:relative}
.money::before{content:"$";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:20px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-radius:0;padding:6px 14px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks button{padding:5px 10px;font-size:13px}
.checks button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner.a{background:var(--accent-soft)}
.banner.b{background:var(--blue-soft)}
.banner.wait{background:var(--bg);color:var(--muted)}
.banner b{font-weight:700}
.outcome{border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600}
.outcome.go{background:var(--accent-soft);color:var(--accent)}
.outcome.stop{background:var(--warn-soft);color:var(--warn)}
.outcome.info{background:var(--blue-soft);color:var(--blue)}
.path{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:12px}
.path h3{margin:0;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.saved{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.saved li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.saved li .t{flex:1;min-width:0}
.saved li .t small{display:block;color:var(--muted)}
.saved li button{padding:3px 8px;font-size:12px}
.muted{color:var(--muted);font-size:12.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{flex:1;min-height:300px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;outline:none}
.drop:focus,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:11px;border-radius:50%;line-height:16px}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2{margin:0}
details.card[open] summary h2{margin-bottom:12px}
.secclear{margin-left:auto;padding:2px 9px;font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="saveddata">[]</script>
<script id="app">
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- PI Sheet definition ---------- */
var SECTIONS=[
 {id:"lead",title:"Lead information"},
 {id:"debt",title:"Debt on the property"},
 {id:"offer",title:"Offer script (BOFSLO)"},
 {id:"mot",title:"Motivation & condition"},
 {id:"desc",title:"Property description"},
 {id:"notes",title:"Notes"}
];
function yes(k){return S.v[k]==="yes"} function no(k){return S.v[k]==="no"}
var F=[
 {id:"source",sec:"lead",label:"Source",type:"text",ask:false,hint:"Zillow, Facebook Marketplace, referral…"},
 {id:"listingUrl",sec:"lead",label:"Listing link",type:"text",ask:false,wide:true},
 {id:"ownerName",sec:"lead",label:"Owner's name",type:"text",say:"Can I get your full name?"},
 {id:"phone",sec:"lead",label:"Property Owner",type:"tel",ask:false,hint:"Owner's phone number (from “Listed by: Property Owner” on the listing)"},
 {id:"address",sec:"lead",label:"Address",type:"text",say:"What's the property address?"},
 {id:"city",sec:"lead",label:"City",type:"text"},
 {id:"state",sec:"lead",label:"State",type:"text"},
 {id:"zip",sec:"lead",label:"ZIP",type:"text"},
 {id:"email",sec:"lead",label:"Email",type:"email",say:"And your email?"},
 {id:"listPrice",sec:"lead",label:"Listing price (on site)",type:"money",ask:false,hint:"Filled from the listing"},
 {id:"askingPrice",sec:"lead",label:"Seller's asking price",type:"money",say:"What are you asking for the house?",hint:"What the seller tells you on the call"},
 {id:"appraise",sec:"lead",label:"Seller's appraisal estimate",type:"money",say:"What do you think it would appraise for?"},
 {id:"comps",sec:"lead",label:"Your comps",type:"text",ask:false,hint:"Your own number — not asked"},

 {id:"hasDebt",sec:"debt",label:"Debt on the property?",type:"yn",say:"Do you still have a debt on the property?"},
 {id:"loanBalance",sec:"debt",label:"Loan balance",type:"money",say:"OK, great! About how much do you owe?",show:function(){return yes("hasDebt")}},
 {id:"payment",sec:"debt",label:"Monthly payment",type:"money",say:"About how much are your payments?",show:function(){return yes("hasDebt")}},
 {id:"piti",sec:"debt",label:"Payment is PITI?",type:"yn",say:"Does that payment include taxes and insurance?",show:function(){return yes("hasDebt")}},
 {id:"current",sec:"debt",label:"Payment current?",type:"yn",say:"Are the payments current?",show:function(){return yes("hasDebt")}},
 {id:"arrears",sec:"debt",label:"Amount in arrears",type:"money",say:"About how far behind are you?",show:function(){return yes("hasDebt")&&no("current")}},

 {id:"sellForOwed",sec:"offer",path:"A",label:"Sell for what you owe?",type:"yn",say:"Will you sell your house for what you owe on it?",show:function(){return path()==="A"}},
 {id:"leastForEquity",sec:"offer",path:"A",label:"Least they'd accept for equity",type:"money",say:"If we take over your debt and pay all closing costs, what's the least you could accept for your equity?",show:function(){return path()==="A"&&no("sellForOwed")}},
 {id:"takePayments",sec:"offer",path:"B",label:"Open to monthly payments?",type:"yn",say:"If we can pay a great price and close whenever you want and pay all closing costs, are you in a position to take monthly payments until we pay you off in full?",show:function(){return path()==="B"}},
 {id:"cashOnly",sec:"offer",path:"B",label:"All cash now only?",type:"yn",say:"So you're saying the only way you will sell is if you get all cash now?",show:function(){return path()==="B"&&no("takePayments")}},
 {id:"hearImmediately",sec:"offer",path:"B",label:"Want to hear how we buy immediately?",type:"yn",say:"So you are saying you would like to hear how we can buy your house immediately?",show:function(){return path()==="B"&&no("takePayments")&&no("cashOnly")}},
 {id:"callbackTime",sec:"offer",label:"Best time for the boss to call",type:"text",say:"OK, I'll have my boss call you. What's the best time?",show:function(){return outcome().k==="go"},wide:true},

 {id:"howArrived",sec:"mot",label:"How they arrived at asking price",type:"text",say:"How did you arrive at your asking price?",wide:true},
 {id:"reason",sec:"mot",label:"Reason for selling",type:"text",say:"What's got you thinking about selling?",wide:true},
 {id:"repairs",sec:"mot",label:"Needs repairs?",type:"yn",say:"Does it need any repairs?"},
 {id:"repairAmt",sec:"mot",label:"Approx. repair amount",type:"money",say:"About how much would those run?",show:function(){return yes("repairs")}},
 {id:"occupancy",sec:"mot",label:"Vacant or occupied",type:"choice",opts:["Vacant","Occupied"],say:"Is anyone living there right now?"},
 {id:"whenMove",sec:"mot",label:"When they want to move",type:"text",say:"When do you want to move?"},
 {id:"listed",sec:"mot",label:"Listed with an agent?",type:"yn",say:"Is the house listed?"},

 {id:"propertyType",sec:"desc",label:"Property type",type:"choice",opts:["Single-Family","Multi-Family","Condo","Duplex","Commercial","Other"],ask:false,wide:true},
 {id:"beds",sec:"desc",label:"Bedrooms",type:"text",say:"How many bedrooms?"},
 {id:"baths",sec:"desc",label:"Bathrooms",type:"text",say:"How many bathrooms?"},
 {id:"sqft",sec:"desc",label:"Square feet",type:"text",say:"About how many square feet?"},
 {id:"lot",sec:"desc",label:"Lot size",type:"text",say:"How big is the lot?"},
 {id:"construction",sec:"desc",label:"Construction",type:"choice",opts:["Frame","Brick","Block","Stucco","Other"],say:"Is it frame, brick, block or stucco?"},
 {id:"constructionOther",sec:"desc",label:"Other construction",type:"text",show:function(){return S.v.construction==="Other"}},
 {id:"garage",sec:"desc",label:"Garage",type:"text",say:"Is there a garage? How many cars?"},
 {id:"amenities",sec:"desc",label:"Amenities",type:"checks",opts:["Carport","Basement","Refrigerator","Range","Dishwasher"],ask:false,wide:true},
 {id:"description",sec:"desc",label:"Description",type:"textarea",ask:false,wide:true},
 {id:"listingNotes",sec:"desc",label:"Listing details (year built, days on market, Zestimate, HOA…)",type:"textarea",ask:false,wide:true},
 {id:"notes",sec:"notes",label:"Notes",type:"textarea",ask:false,wide:true}
];
var FMAP={};F.forEach(function(f){FMAP[f.id]=f});

/* ---------- state ---------- */
var S;
function blank(){return {id:"c"+Date.now().toString(36),v:{date:today(),amenities:[]},ai:{},ev:{},manual:{},transcript:""}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
S=blank();
try{var draft=JSON.parse(LS.get("pi_draft")||"null");if(draft&&draft.v)S=draft}catch(e){}
var SAVED=[];try{SAVED=JSON.parse($("#saveddata").textContent)||[]}catch(e){SAVED=[]}
function persist(){LS.set("pi_draft",JSON.stringify(S))}

function num(x){if(x==null||x==="")return null;var n=parseFloat(String(x).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n}
function money(x){var n=num(x);return n==null?"":"$"+Math.round(n).toLocaleString()}
function askBasis(){var a=num(S.v.askingPrice);if(a!=null)return {n:a,lbl:"asking"};var l=num(S.v.listPrice);return l!=null?{n:l,lbl:"listing price"}:null}
function path(){
 if(!S.v.hasDebt)return null;
 if(no("hasDebt"))return "B";
 var ab=askBasis(),a=ab&&ab.n,b=num(S.v.loanBalance);
 if(a==null||b==null)return null;
 return Math.abs(a-b)<=35000?"A":"B";
}
function outcome(){
 var p=path();
 if(p==="A"){if(yes("sellForOwed"))return {k:"go",t:"Seller will sell for what's owed: set the callback with your boss."};
  if(no("sellForOwed"))return S.v.leastForEquity?{k:"info",t:"Equity ask recorded ("+money(S.v.leastForEquity)+"). Pass to your boss with the debt details."}:{k:"",t:""};}
 if(p==="B"){if(yes("takePayments"))return {k:"go",t:"Open to monthly payments: have your boss call to discuss terms."};
  if(yes("cashOnly"))return {k:"stop",t:"Cash only: “OK, I understand but that won't work for us. Thanks.” Stop here."};
  if(yes("hearImmediately"))return {k:"go",t:"Wants to hear how we can buy immediately: have your boss call."};
  if(no("hearImmediately"))return {k:"stop",t:"Not interested: thank them and end the call."};}
 return {k:"",t:""};
}
function visible(f){return !f.show||f.show()}
function filled(f){var v=S.v[f.id];return f.type==="checks"?(v&&v.length):(v!=null&&String(v).trim()!=="")}

/* ---------- render ---------- */
function shell(){
 $("#root").innerHTML=
 '<header><h1>PI Sheet <span>Call Assistant</span></h1><div class="meta">'+
 '<button id="install" class="primary" style="display:none">Install app</button><button id="clearall">Clear all</button><label>Name <input type="text" id="student" placeholder="Caller name"></label>'+
 '<label>Date <input type="date" id="date"></label></div></header>'+
 '<div class="wrap"><aside class="side">'+
  '<details class="card" id="importcard" open><summary><h2>Import from a listing</h2></summary>'+
   '<input type="text" id="lurl" placeholder="Paste the Zillow / Facebook / Redfin link">'+
   '<textarea id="ltext" rows="4" style="margin-top:8px;font-size:12.5px" placeholder="Paste the listing text here: on the listing press Ctrl+A, then Ctrl+C, then paste. Everything fills in automatically, including the Property Owner phone."></textarea>'+
   '<div class="drop" id="ldrop" tabindex="0" style="margin-top:8px">Screenshots: attach for your own reference (they aren’t read automatically)</div>'+
   '<input type="file" id="lfile" accept="image/*" multiple style="display:none">'+
   '<div class="thumbs" id="lthumbs"></div>'+
   '<div class="row"><button class="primary" id="lgo">Fill again</button><button id="lclear">Clear</button></div>'+
   '<div class="status" id="lstatus">Paste the link, then copy the listing page text (Ctrl+A, Ctrl+C) into the box. Price, beds, baths, sq ft, address and the Property Owner phone fill in automatically.</div>'+
  '</details>'+
  '<div class="card"><h2>Live call</h2>'+
   '<button class="mic primary" id="mic" disabled><span class="dot"></span><span id="micl">Connecting…</span></button>'+
   '<div class="status" id="micstatus"></div>'+
   '<div class="row" style="display:none"><button id="fill">Auto-fill</button><label class="muted"><input type="checkbox" id="autofill"></label></div>'+
   '<div class="status" id="fillstatus"></div>'+
   '<div style="margin-top:10px"><textarea id="transcript" placeholder="The live transcript appears here while you listen. You can also type or paste call notes. It is saved with the call."></textarea>'+
   '<div class="interim" id="interim"></div></div>'+
  '</div>'+
  '<div class="card next" id="nextcard"></div>'+
  '<div class="card"><h2>Finish</h2><div class="actions">'+
   '<button class="primary" id="save">Save to call log</button><button id="copy">Copy summary</button><button id="newcall">Clear all</button></div>'+'<div class="actions" style="margin-top:8px"><button id="exportcsv">Download call log (Excel/CSV)</button><button id="backup">Back up</button><button id="restore">Restore</button><input type="file" id="restorefile" accept=".json,application/json" style="display:none"></div>'+'<div class="muted" style="margin-top:6px">Calls are saved on this device and browser only. Download or back up to move them.</div>'+
   '<div class="status" id="savestatus"></div>'+
   '<div id="crmbox" style="display:none;margin-top:14px"><h2>Send to CRM</h2>'+
    '<label class="muted" style="display:block;margin-bottom:6px">Sellers Pipeline stage</label>'+
    '<select id="crmstage" style="width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)"></select>'+
    '<div class="row"><button class="primary" id="crmsend">Send to CRM</button></div>'+
    '<div class="status" id="crmstatus"></div></div>'+
   '<h2 style="margin-top:14px">Call log <span class="n" id="savedn">0</span></h2><ul class="saved" id="saved"></ul></div>'+
 '</aside><main class="sheet" id="sheet"></main></div>'+
 '<div class="modal" id="modal"><div class="box"><b>Call summary</b><span class="muted">Copy this into your CRM notes.</span><textarea id="modaltext" readonly></textarea><div class="actions"><button class="primary" id="modalcopy">Copy</button><button id="modalclose">Close</button></div></div></div>'+
 '<div class="toast" id="toast"></div>';
 var st=$("#student");st.value=LS.get("pi_student")||"";st.oninput=function(){LS.set("pi_student",st.value)};
 var dt=$("#date");dt.value=S.v.date||today();dt.onchange=function(){S.v.date=dt.value;persist()};
 var tr=$("#transcript");tr.value=S.transcript||"";tr.oninput=function(){S.transcript=tr.value;persist()};
}

function fieldHTML(f){
 var v=S.v[f.id],h='';
 if(f.type==="money")h='<div class="money"><input type="text" inputmode="decimal" data-f="'+f.id+'" value="'+esc(v||"")+'"></div>';
 else if(f.type==="yn")h='<div class="seg" data-seg="'+f.id+'"><button data-val="yes" class="'+(v==="yes"?"on":"")+'">Yes</button><button data-val="no" class="'+(v==="no"?"on":"")+'">No</button></div>';
 else if(f.type==="choice")h='<div class="seg" data-seg="'+f.id+'">'+f.opts.map(function(o){return '<button data-val="'+o+'" class="'+(v===o?"on":"")+'">'+o+'</button>'}).join("")+'</div>';
 else if(f.type==="checks")h='<div class="checks" data-checks="'+f.id+'">'+f.opts.map(function(o){return '<button data-val="'+o+'" class="'+((v||[]).indexOf(o)>-1?"on":"")+'">'+o+'</button>'}).join("")+'</div>';

 "Return ONLY JSON: {\"fields\":{...},\"evidence\":{...}}.\n"+
 "- Include a key only when the listing clearly shows it. Never guess.\n"+
 "- evidence: for each field, a short snippet (under 12 words) from the listing.\n"+
 "- listPrice: the price shown on the listing. It is NOT the seller's asking price from a call.\n"+
 "- source: the site the listing is on, e.g. \"Zillow\" or \"Facebook Marketplace\".\n"+
 "- phone: on Zillow for-sale-by-owner listings the owner's number appears in the \"Listed by:\" area right under \"Property Owner\" (e.g. \"Listed by: Property Owner (317) 555-0101\"). Always take that number as phone. On other sites use the owner's number if the owner (FSBO / Marketplace seller) shows one.\n"+
 "- ownerName: the owner's actual name only if shown. \"Property Owner\" is a label, never a name.\n"+
 "- Never fill ownerName, phone or email with a listing agent's or brokerage's details (\"Listed by: <agent name>, <brokerage>\").\n"+

 "- address is the street line only; city, state (2-letter), zip separately.\n"+
 "- description: 1–2 sentences on the house in your own words.\n"+
 "- listingNotes: short lines with useful extras that have no other field: year built, days on market, Zestimate or Rent Zestimate, price history/cuts, HOA, taxes, heating/cooling, the listing agent's name and brokerage if agent-listed.\n\n"+
 "Field keys and types:\n"+schema(LIST_IDS)+"\n\n"+(url?"Listing link: "+url+"\n\n":"")+(txt?"Listing text:\n\"\"\"\n"+txt.slice(0,30000)+"\n\"\"\"":"See the attached screenshots.");

 sample.json(prompt,opts).then(function(res){

 },function(err){var c=err&&err.code;st.className="status err";

 if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
 if(p&&p.content&&Array.isArray(p.content)){var t=p.content.map(function(c){return c.text||""}).join("");try{p=JSON.parse(t)}catch(e){p=t}}
